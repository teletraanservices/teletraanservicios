{% extends 'core/base.html' %}
{% block title %}Contraseña actualizada | Teletraan Services{% endblock %}
{% block robots_content %}noindex, nofollow{% endblock %}
{% block content %}
<div class="container py-5 login-page">
  <div class="row justify-content-center w-100">
    <div class="col-sm-10 col-md-7 col-lg-5">
      <section class="card card-teletraan auth-card p-4 p-md-5 shadow-lg text-center" aria-labelledby="reset-complete-title">
        <span class="login-icon mb-3" aria-hidden="true"><i class="bi bi-shield-check"></i></span>
        <h1 class="h2 fw-bold text-white" id="reset-complete-title">Contraseña actualizada</h1>
        <p class="text-secondary">Ya puedes iniciar sesión con tu nueva contraseña.</p>
        <a class="btn btn-teletraan w-100 py-2 mt-2" href="{% url 'login' %}">Ir a iniciar sesión</a>
      </section>
    </div>
  </div>
</div>
{% endblock %}
